name: Deploy to GitHub Pages

on:
  # Rebuild and deploy on every push to main
  push:
    branches: [main]
  # ...and let you trigger it manually from the Actions tab
  workflow_dispatch:

# Permissions the deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro site
        # Official Astro action: installs deps, runs `astro build`,
        # and uploads dist/ as the Pages artifact.
        uses: withastro/action@v3
        with:
          # The action defaults to Node 20; Astro 7 needs 22.12+.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
